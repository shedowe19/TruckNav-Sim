name: PR Build Check

on:
    pull_request:
        branches:
            - main
            - master

jobs:
    build-check:
        name: Nuxt Build Check
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"

            - name: Install Dependencies
              run: npm install

            - name: Build Nuxt App
              run: |
                  npx nuxi build
                  npx nuxi generate
